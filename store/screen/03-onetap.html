<!doctype html>
<!--
  スライド 03 — 一覧からのワンタップコピー。
  キャプチャに写っているものだけを書く: プロファイルチップ「Main」、
  カテゴリの絞り込みチップ、各カードの展開・削除・編集・コピーの丸ボタン。
  タイトルをタップするとタイトルだけがコピーされる挙動は store/store_ja.txt に準拠。
-->
<meta charset="utf-8" />
<template id="slide">
  <div class="head">
    <h1 class="ja">
      <span class="line">定型文を開かずに、</span>
      <span class="line accent">一覧からコピーする。</span>
    </h1>
    <h1 class="en">
      <span class="line">Copy from the list,</span>
      <span class="line accent">without opening it.</span>
    </h1>

    <p class="sub ja">コピーボタンで本文ごと、タイトルをタップすればタイトルだけ。カテゴリで絞り込めます。</p>
    <p class="sub en">The copy button takes the whole text; tap the title for the title alone. Filter by category.</p>

    <p class="note"></p>
  </div>

  <div class="stage" data-shots="1">
    <figure class="shot">
      <div class="phone">
        <div class="phone-inner">
          <img src="{{IMG}}/01-hero-left-home.png" width="1170" height="2532" alt="" />
        </div>
      </div>
      <figcaption class="cap"></figcaption>
    </figure>
  </div>
</template>
