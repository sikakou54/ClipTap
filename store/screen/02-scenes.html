<!doctype html>
<!--
  スライド 02 — 使う場面。
  見出しとリードは LP の scenes セクション（apps/web/index.html:215-）から逐語流用。
  第三者UI（X・Gmail）を同時に2つ載せる唯一のスライドなので、商標注記をここに置く。
-->
<meta charset="utf-8" />
<template id="slide">
  <div class="head">
    <h1 class="ja">
      <span class="line">打っていた時間が、</span>
      <span class="line accent">タップになる。</span>
    </h1>
    <h1 class="en">
      <span class="line">What you used to type</span>
      <span class="line accent">becomes a tap.</span>
    </h1>

    <p class="sub ja">朝の報告、毎日のタグ、いつもの返信。XにもGmailにも、ClipTapのキーボードから入力できます。</p>
    <p class="sub en">The morning update, the daily hashtag, the same reply. X, Gmail — straight from the ClipTap keyboard.</p>

    <p class="note">
      <span class="ja">記載の製品名は各社の商標です。ClipTapは各社と提携していません。</span>
      <span class="en">Product names are trademarks of their respective owners. ClipTap is not affiliated with them.</span>
    </p>
  </div>

  <div class="stage" data-shots="2">
    <figure class="shot">
      <div class="phone">
        <div class="phone-inner">
          <img src="{{IMG}}/02-scene-2-sns.png" width="1170" height="2532" alt="" />
        </div>
      </div>
      <figcaption class="cap">X</figcaption>
    </figure>
    <figure class="shot">
      <div class="phone">
        <div class="phone-inner">
          <img src="{{IMG}}/02-scene-3-mail.png" width="1170" height="2532" alt="" />
        </div>
      </div>
      <figcaption class="cap">Gmail</figcaption>
    </figure>
  </div>
</template>
