<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200, initial-scale=1">
  <title>ClipTap OGP - Japanese</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #0066FF;
      --brand-secondary: #00D4FF;
      --brand-accent: #FF6B35;
      --bg-dark: #0A0F1C;
      --bg-elevated: #131B2E;
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.18);
      --text-white: #FFFFFF;
      --text-gray: rgba(255, 255, 255, 0.70);
      --radius-phone: 44px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', -apple-system, 'Hiragino Sans', Meiryo, sans-serif;
      color: var(--text-white);
      background: var(--bg-dark);
      -webkit-font-smoothing: antialiased;
      text-rendering: geometricPrecision;
    }

    #og {
      position: relative;
      isolation: isolate;
      width: 1200px;
      height: 630px;
      display: grid;
      grid-template-columns: 58% 42%;
      overflow: hidden;
      background:
        radial-gradient(ellipse 82% 95% at 12% 0%, rgba(0, 102, 255, 0.46), transparent 58%),
        radial-gradient(ellipse 70% 80% at 92% 94%, rgba(0, 212, 255, 0.28), transparent 56%),
        linear-gradient(180deg, #0A0F1C 0%, #131B2E 100%);
    }

    #og::before {
      position: absolute;
      inset: 0;
      z-index: -1;
      content: '';
      opacity: 0.34;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: linear-gradient(90deg, black, transparent 76%);
    }

    #og::after {
      position: absolute;
      top: -145px;
      right: -70px;
      z-index: -1;
      width: 560px;
      height: 560px;
      content: '';
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0, 102, 255, 0.20), transparent 68%);
      filter: blur(2px);
    }

    .copy {
      position: relative;
      z-index: 2;
      min-width: 0;
      padding: 58px 0 46px 72px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      min-height: 39px;
      padding: 8px 17px;
      border: 1px solid var(--glass-border);
      border-radius: 999px;
      color: var(--brand-secondary);
      background: var(--glass-bg);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.12em;
    }

    .tag-dot {
      width: 9px;
      height: 9px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--brand-secondary);
      box-shadow: 0 0 14px var(--brand-secondary);
    }

    .headline {
      width: 618px;
      margin-top: 27px;
      font-size: 64px;
      font-weight: 900;
      line-height: 1.19;
      letter-spacing: -0.055em;
      white-space: nowrap;
    }

    .headline-line {
      display: block;
    }

    .headline-line--accent {
      background: linear-gradient(118deg, #FFFFFF 2%, #D9F7FF 56%, #68E2FF 100%);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
    }

    .subcopy {
      width: 590px;
      margin-top: 22px;
      color: var(--text-gray);
      font-size: 21px;
      font-weight: 500;
      line-height: 1.65;
      letter-spacing: 0.01em;
    }

    .brand-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: auto;
    }

    .brand-icon {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 14px;
      color: #FFFFFF;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      box-shadow: 0 12px 32px -10px rgba(0, 102, 255, 0.82);
      font-size: 21px;
      font-weight: 800;
    }

    .brand-name {
      font-size: 27px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -0.03em;
    }

    .brand-url {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.52);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .visual {
      position: relative;
      z-index: 1;
      min-width: 0;
    }

    .visual-orbit {
      position: absolute;
      top: 78px;
      left: 12px;
      width: 470px;
      height: 470px;
      border: 1px solid rgba(0, 212, 255, 0.16);
      border-radius: 50%;
      box-shadow:
        0 0 0 44px rgba(0, 102, 255, 0.035),
        0 0 0 88px rgba(0, 212, 255, 0.022);
    }

    .phone {
      position: absolute;
      top: 16px;
      left: 82px;
      width: 310px;
      height: 596px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      transform: rotate(-6deg);
      transform-origin: 50% 50%;
      border-radius: var(--radius-phone);
      background: linear-gradient(145deg, #29292D 0%, #09090B 68%);
      box-shadow:
        0 38px 80px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(255, 255, 255, 0.18),
        0 0 70px rgba(0, 102, 255, 0.20),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
    }

    .phone-inner {
      position: relative;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border-radius: 34px;
      color: #1C1C1E;
      background: #F8FAFD;
    }

    .dynamic-island {
      position: absolute;
      top: 20px;
      left: 50%;
      z-index: 20;
      width: 112px;
      height: 31px;
      transform: translateX(-50%);
      border-radius: 20px;
      background: #000000;
    }

    .phone-status {
      min-height: 66px;
      padding: 43px 23px 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      color: #111318;
      font-size: 10px;
      letter-spacing: -0.08em;
    }

    .battery {
      width: 19px;
      height: 9px;
      padding: 1px;
      border: 1.5px solid #111318;
      border-radius: 3px;
    }

    .battery::before {
      display: block;
      width: 13px;
      height: 5px;
      content: '';
      border-radius: 1px;
      background: #111318;
    }

    .phone-nav {
      min-height: 58px;
      padding: 8px 18px 12px;
      display: flex;
      align-items: center;
      gap: 11px;
      border-bottom: 1px solid #E8EBF1;
      background: rgba(255, 255, 255, 0.84);
    }

    .avatar {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      font-size: 13px;
      font-weight: 800;
    }

    .phone-title {
      font-size: 15px;
      font-weight: 800;
    }

    .phone-presence {
      margin-top: 2px;
      color: #7E8592;
      font-size: 9px;
      font-weight: 600;
    }

    .conversation {
      flex: 1;
      min-height: 0;
      padding: 17px 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 9px;
      background:
        radial-gradient(circle at 90% 10%, rgba(0, 102, 255, 0.09), transparent 42%),
        #F4F6FA;
    }

    .message {
      max-width: 78%;
      padding: 10px 12px;
      border-radius: 15px;
      font-size: 10px;
      font-weight: 600;
      line-height: 1.45;
    }

    .message--incoming {
      align-self: flex-start;
      border-bottom-left-radius: 5px;
      color: #3B414B;
      background: #FFFFFF;
      box-shadow: 0 5px 14px rgba(35, 46, 68, 0.08);
    }

    .message--outgoing {
      align-self: flex-end;
      border-bottom-right-radius: 5px;
      color: #FFFFFF;
      background: linear-gradient(135deg, var(--brand-primary), #0B8DFF);
      box-shadow: 0 7px 18px rgba(0, 102, 255, 0.22);
    }

    .keyboard-panel {
      padding: 9px 8px 16px;
      flex: 0 0 auto;
      border-top: 1px solid rgba(66, 76, 92, 0.16);
      background: #D5DAE2;
      box-shadow: 0 -8px 24px rgba(41, 51, 70, 0.10);
    }

    .keyboard-toolbar {
      padding: 0 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .keyboard-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #172033;
      font-size: 10px;
      font-weight: 800;
    }

    .keyboard-brand-mark {
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      border-radius: 6px;
      color: white;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      font-size: 8px;
    }

    .keyboard-category {
      padding: 4px 8px;
      border-radius: 999px;
      color: #556070;
      background: rgba(255, 255, 255, 0.60);
      font-size: 8px;
      font-weight: 700;
    }

    .keyboard-snippets {
      margin: 0 0 9px;
      padding: 7px;
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 13px;
      background: rgba(248, 249, 250, 0.76);
    }

    .snippet {
      min-width: 0;
      height: 30px;
      padding: 0 9px;
      display: flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid rgba(47, 59, 78, 0.08);
      border-radius: 9px;
      color: #3C4350;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 3px 8px rgba(40, 51, 70, 0.07);
      font-size: 8px;
      font-weight: 700;
      white-space: nowrap;
    }

    .snippet--active {
      border-color: transparent;
      color: white;
      background: linear-gradient(135deg, var(--brand-primary), #149DFF);
    }

    .snippet--variable {
      color: var(--brand-primary);
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .keyboard-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin-bottom: 6px;
    }

    .key {
      height: 29px;
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      color: #303640;
      background: #FFFFFF;
      box-shadow: 0 1px 0 #AEB4BE, 0 2px 3px rgba(48, 56, 69, 0.12);
      font-size: 8px;
      font-weight: 700;
    }

    .keyboard-row--inset {
      padding: 0 13px;
    }

    .key--shift,
    .key--delete {
      flex: 1.35 1 0;
      color: #252B35;
      background: #ABB2BD;
    }

    .key--number,
    .key--return {
      flex: 1.65 1 0;
      color: #252B35;
      background: #ABB2BD;
    }

    .key--wide {
      flex: 4.6 1 0;
      color: white;
      background: linear-gradient(135deg, var(--brand-primary), var(--brand-secondary));
      box-shadow: 0 1px 0 #007EAD, 0 5px 10px rgba(0, 102, 255, 0.20);
    }

    .home-indicator {
      position: absolute;
      bottom: 5px;
      left: 50%;
      z-index: 30;
      width: 112px;
      height: 4px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(17, 19, 24, 0.86);
    }
  </style>
</head>
<body class="lang-ja">
  <main id="og" aria-label="ClipTap OGP image">
    <section class="copy">
      <div class="tag"><span class="tag-dot"></span><span>KEYBOARD</span></div>
      <h1 class="headline">
        <span class="headline-line">どのアプリにも</span>
        <span class="headline-line headline-line--accent">定型文をワンタップ</span>
      </h1>
      <p class="subcopy">アプリを切り替えず、キーボードからそのまま入力。<br>コピペの手間を、今日からゼロに。</p>
      <div class="brand-row">
        <div class="brand-icon">C</div>
        <div>
          <div class="brand-name">ClipTap</div>
          <div class="brand-url">cliptap.net</div>
        </div>
      </div>
    </section>

    <section class="visual" aria-hidden="true">
      <div class="visual-orbit"></div>
      <div class="phone">
        <div class="dynamic-island"></div>
        <div class="phone-inner">
          <div class="phone-status">
            <span>9:41</span>
            <span class="status-icons">▮▮▮ ◒ <span class="battery"></span></span>
          </div>
          <div class="phone-nav">
            <div class="avatar">S</div>
            <div>
              <div class="phone-title">サポート</div>
              <div class="phone-presence">● オンライン</div>
            </div>
          </div>
          <div class="conversation">
            <div class="message message--incoming">資料の送付をお願いします。</div>
            <div class="message message--outgoing">お問い合わせありがとうございます。<br>本日中にお送りします。</div>
          </div>
          <div class="keyboard-panel">
            <div class="keyboard-toolbar">
              <span class="keyboard-brand"><span class="keyboard-brand-mark">C</span>ClipTap</span>
              <span class="keyboard-category">仕事 ▼</span>
            </div>
            <div class="keyboard-snippets">
              <div class="snippet snippet--active">お問い合わせ返信</div>
              <div class="snippet">確認いたしました</div>
              <div class="snippet">よろしくお願いします</div>
              <div class="snippet snippet--variable">{{today}}</div>
            </div>
            <div class="keyboard-row">
              <span class="key">Q</span><span class="key">W</span><span class="key">E</span><span class="key">R</span><span class="key">T</span><span class="key">Y</span><span class="key">U</span><span class="key">I</span><span class="key">O</span><span class="key">P</span>
            </div>
            <div class="keyboard-row keyboard-row--inset">
              <span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="key">F</span><span class="key">G</span><span class="key">H</span><span class="key">J</span><span class="key">K</span><span class="key">L</span>
            </div>
            <div class="keyboard-row">
              <span class="key key--shift">⇧</span><span class="key">Z</span><span class="key">X</span><span class="key">C</span><span class="key">V</span><span class="key">B</span><span class="key">N</span><span class="key">M</span><span class="key key--delete">⌫</span>
            </div>
            <div class="keyboard-row">
              <span class="key key--number">123</span><span class="key">🌐</span><span class="key key--wide">space</span><span class="key key--return">return</span>
            </div>
          </div>
          <div class="home-indicator"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
