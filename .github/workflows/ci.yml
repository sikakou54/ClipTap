name: CI

on:
  pull_request:
  push:
    branches:
      - 'release/**'

jobs:
  types-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # settings.gradle が node で react-native / expo のパスを解決するため、依存関係が必須
      - run: npm ci
        working-directory: .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: ./gradlew assembleDebug

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/mobile/ios
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Podfile が node で react-native / expo のパスを解決するため、依存関係が必須
      - run: npm ci
        working-directory: .
      - run: pod install
      - run: xcodebuild build -workspace ClipTap.xcworkspace -scheme ClipTap -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO
