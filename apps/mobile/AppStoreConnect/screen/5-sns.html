<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>ClipTap - Screen 5: sns</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    
    :root {
      --brand-primary: #0066FF;
      --brand-secondary: #00D4FF;
      --brand-accent: #FF6B35;
      --bg-dark: #0A0F1C;
      --bg-card: rgba(255,255,255,0.08);
      --glass-bg: rgba(255,255,255,0.12);
      --glass-border: rgba(255,255,255,0.18);
      --text-white: #FFFFFF;
      --text-gray: rgba(255,255,255,0.7);
      --radius-screen: 0px;
      --radius-phone: 44px;
      --radius-ui: 16px;
      
      /* Responsive font size variables */
      --font-headline-jp: clamp(24px, 6vw, 32px);
      --font-headline-en: clamp(11px, 3vw, 14px);
      --font-subcopy: clamp(11px, 2.8vw, 13px);
      --font-tag: clamp(9px, 2.5vw, 11px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
      background: #0A0F1C;
      color: var(--text-white);
      padding: 40px 20px 80px;
    }

    h1 {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 40px;
      color: var(--text-gray);
      letter-spacing: 0.1em;
    }

    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 32px;
      max-width: 1600px;
      margin: 0 auto;
    }

    /* ===== Screen Card ===== */
    .screen {
      width: min(420px, 92vw);
      aspect-ratio: 9 / 19.5;
      border-radius: var(--radius-screen);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Gradient backgrounds for each screen */
    .screen--1 {
      background: 
        radial-gradient(ellipse 120% 80% at 20% 10%, rgba(0,102,255,0.4) 0%, transparent 50%),
        radial-gradient(ellipse 100% 60% at 80% 90%, rgba(0,212,255,0.3) 0%, transparent 50%),
        linear-gradient(180deg, #0A0F1C 0%, #131B2E 100%);
    }

    .screen--2 {
      background: 
        radial-gradient(ellipse 100% 80% at 80% 20%, rgba(138,43,226,0.35) 0%, transparent 50%),
        radial-gradient(ellipse 80% 60% at 20% 80%, rgba(0,102,255,0.3) 0%, transparent 50%),
        linear-gradient(180deg, #0F0A1C 0%, #1B1331 100%);
    }

    .screen--3 {
      background: 
        radial-gradient(ellipse 100% 70% at 30% 10%, rgba(0,212,255,0.35) 0%, transparent 50%),
        radial-gradient(ellipse 90% 60% at 70% 85%, rgba(0,102,255,0.25) 0%, transparent 50%),
        linear-gradient(180deg, #0A1A1C 0%, #132531 100%);
    }

    .screen--4 {
      background: 
        radial-gradient(ellipse 110% 70% at 70% 15%, rgba(255,107,53,0.3) 0%, transparent 50%),
        radial-gradient(ellipse 80% 50% at 30% 80%, rgba(0,102,255,0.25) 0%, transparent 50%),
        linear-gradient(180deg, #1C0F0A 0%, #2E1B13 100%);
    }

    .screen--5 {
      background: 
        radial-gradient(ellipse 100% 80% at 50% 10%, rgba(0,212,255,0.3) 0%, transparent 50%),
        radial-gradient(ellipse 80% 50% at 20% 90%, rgba(138,43,226,0.25) 0%, transparent 50%),
        linear-gradient(180deg, #0A1C1C 0%, #132E2E 100%);
    }

    .screen--6 {
      background: 
        radial-gradient(ellipse 90% 70% at 80% 10%, rgba(0,102,255,0.4) 0%, transparent 50%),
        radial-gradient(ellipse 100% 60% at 10% 80%, rgba(0,212,255,0.25) 0%, transparent 50%),
        linear-gradient(180deg, #0A0F1C 0%, #131B2E 100%);
    }

    /* Floating decorative elements */
    .screen::before {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,102,255,0.15) 0%, transparent 70%);
      top: -50px;
      right: -50px;
      pointer-events: none;
    }

    .screen::after {
      content: '';
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,212,255,0.1) 0%, transparent 70%);
      bottom: 100px;
      left: -30px;
      pointer-events: none;
    }

    /* ===== Header Section ===== */
    .screen-header {
      padding: 36px 28px 20px;
      z-index: 10;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: var(--font-tag);
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      color: var(--brand-secondary);
      margin-bottom: 16px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .tag-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand-secondary);
      box-shadow: 0 0 12px var(--brand-secondary);
    }

    .headline-jp {
      font-size: var(--font-headline-jp);
      font-weight: 900;
      line-height: 1.3;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFFFFF 0%, rgba(255,255,255,0.85) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .headline-en {
      font-size: var(--font-headline-en);
      font-weight: 600;
      color: var(--text-gray);
      margin-bottom: 12px;
      letter-spacing: 0.02em;
    }

    .subcopy {
      font-size: var(--font-subcopy);
      line-height: 1.7;
      color: rgba(255,255,255,0.6);
      max-width: 95%;
    }

    /* ===== Phone Mockup ===== */
    .screen-body {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 0 20px 0;
      z-index: 5;
    }

    .phone {
      position: relative;
      width: 88%;
      max-width: 300px;
      height: 82%;
      background: linear-gradient(145deg, #1C1C1E 0%, #0D0D0F 100%);
      border-radius: var(--radius-phone);
      box-shadow: 
        0 30px 60px rgba(0,0,0,0.5),
        0 0 0 1px rgba(255,255,255,0.1),
        inset 0 1px 0 rgba(255,255,255,0.1);
      padding: 12px;
      display: flex;
      flex-direction: column;
      transform: translateY(40px);
    }

    .phone-inner {
      flex: 1;
      background: #FFFFFF;
      border-radius: 34px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 32px;
      background: #000;
      border-radius: 20px;
      z-index: 20;
    }

    /* Phone UI Content */
    .phone-status {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 50px 20px 10px;
      font-size: 14px;
      font-weight: 600;
      color: #1C1C1E;
    }

    .status-icons {
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .status-icons svg {
      width: 16px;
      height: 16px;
    }

    .phone-nav {
      padding: 8px 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .phone-title {
      font-size: 20px;
      font-weight: 700;
      color: #1C1C1E;
    }

    .phone-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
      color: white;
    }

    .phone-content {
      flex: 1;
      padding: 0 12px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow: hidden;
    }

    /* List Items */
    .list-card {
      background: #F8F9FA;
      border-radius: 14px;
      overflow: hidden;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid #E8EAED;
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .list-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .list-icon--blue { background: #E8F4FF; }
    .list-icon--purple { background: #F3E8FF; }
    .list-icon--green { background: #E8FFF3; }
    .list-icon--orange { background: #FFF3E8; }

    .list-label {
      font-size: 13px;
      font-weight: 600;
      color: #1C1C1E;
    }

    .list-meta {
      font-size: 11px;
      color: #8E8E93;
    }

    .list-chevron {
      color: #C7C7CC;
      font-size: 14px;
    }

    /* Chips */
    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 8px 0;
    }

    .chip {
      font-size: 10px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, #EEF4FF 0%, #E8F0FF 100%);
      color: #0066FF;
    }

    /* Text Area Preview */
    .textarea-preview {
      background: #F8F9FA;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 11px;
      line-height: 1.6;
      color: #3C3C43;
      position: relative;
    }

    .textarea-preview .var {
      background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 700;
    }

    .textarea-hint {
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px dashed #E8EAED;
      font-size: 9px;
      color: #8E8E93;
    }

    /* Profile Grid */
    .profile-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .profile-card {
      background: #F8F9FA;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .profile-card--active {
      background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
    }

    .profile-card--active .profile-name,
    .profile-card--active .profile-desc {
      color: white;
    }

    .profile-name {
      font-size: 12px;
      font-weight: 700;
      color: #1C1C1E;
    }

    .profile-desc {
      font-size: 9px;
      color: #8E8E93;
    }

    /* SNS Preview */
    .sns-preview-card {
      background: #F8F9FA;
      border-radius: 14px;
      padding: 12px;
    }

    .sns-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .sns-avatar {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
    }

    .sns-username {
      font-size: 12px;
      font-weight: 700;
      color: #1C1C1E;
    }

    .sns-text {
      font-size: 11px;
      line-height: 1.5;
      color: #3C3C43;
      margin-bottom: 8px;
    }

    .sns-hashtags {
      font-size: 11px;
      color: #0066FF;
      font-weight: 600;
    }

    /* Web Sync Illustration */
    .sync-illustration {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 16px;
      background: #F8F9FA;
      border-radius: 14px;
    }

    .device-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .device-icon svg {
      width: 40px;
      height: 40px;
      color: #0066FF;
    }

    .device-label {
      font-size: 9px;
      color: #8E8E93;
      font-weight: 600;
    }

    .sync-arrow {
      font-size: 20px;
      color: #00D4FF;
    }

    /* ===== Brand Footer ===== */
    .brand-footer {
      position: relative;
      z-index: 10;
      padding: 20px 28px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 14px;
      color: white;
    }

    .brand-name {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, #FFFFFF 0%, rgba(255,255,255,0.8) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .brand-tagline {
      font-size: 10px;
      font-weight: 600;
      color: var(--text-gray);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    /* Keyboard illustration */
    .keyboard-row {
      display: flex;
      gap: 4px;
      justify-content: center;
      margin-bottom: 6px;
    }

    .key {
      width: 28px;
      height: 32px;
      background: #E8EAED;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #3C3C43;
      font-weight: 600;
    }

    .key--wide {
      width: 100%;
      background: linear-gradient(135deg, #0066FF 0%, #00D4FF 100%);
      color: white;
    }

    .keyboard-snippets {
      background: #F8F9FA;
      border-radius: 10px 10px 0 0;
      padding: 8px;
      margin: 0 -4px;
    }
  
    
    /* Override for single screen display - full width, no margins */
    body {
      margin: 0;
      padding: 0;
      background: #0A0F1C;
    }
    
    .screen {
      width: 100%;
      max-width: none;
      margin: 0;
      border-radius: 0;
    }

    /* ===== Responsive Font Sizes ===== */
    
    /* Small smartphones (up to 375px - iPhone SE, etc.) */
    @media screen and (max-width: 375px) {
      :root {
        --font-headline-jp: 22px;
        --font-headline-en: 11px;
        --font-subcopy: 10px;
        --font-tag: 9px;
      }
      
      .screen-header {
        padding: 28px 20px 16px;
      }
      
      .tag {
        padding: 5px 10px;
        gap: 6px;
        margin-bottom: 12px;
      }
      
      .tag-dot {
        width: 6px;
        height: 6px;
      }
      
      .headline-jp {
        margin-bottom: 6px;
      }
      
      .headline-en {
        margin-bottom: 10px;
      }
    }

    /* Regular smartphones (376px - 480px) */
    @media screen and (min-width: 376px) and (max-width: 480px) {
      :root {
        --font-headline-jp: 26px;
        --font-headline-en: 12px;
        --font-subcopy: 11px;
        --font-tag: 10px;
      }
      
      .screen-header {
        padding: 32px 24px 18px;
      }
      
      .tag {
        padding: 5px 12px;
        margin-bottom: 14px;
      }
    }

    /* Large smartphones / Small tablets (481px - 768px) */
    @media screen and (min-width: 481px) and (max-width: 768px) {
      :root {
        --font-headline-jp: 30px;
        --font-headline-en: 13px;
        --font-subcopy: 12px;
        --font-tag: 11px;
      }
      
      .screen-header {
        padding: 36px 28px 20px;
      }
    }

    /* Tablets and larger (769px+) */
    @media screen and (min-width: 769px) {
      :root {
        --font-headline-jp: 34px;
        --font-headline-en: 15px;
        --font-subcopy: 14px;
        --font-tag: 12px;
      }
      
      .screen-header {
        padding: 40px 32px 24px;
      }
      
      .tag {
        padding: 8px 16px;
        margin-bottom: 18px;
      }
      
      .headline-jp {
        margin-bottom: 10px;
      }
      
      .headline-en {
        margin-bottom: 14px;
      }
    }

    /* Large tablets / iPad Pro (1024px+) */
    @media screen and (min-width: 1024px) {
      :root {
        --font-headline-jp: 38px;
        --font-headline-en: 16px;
        --font-subcopy: 15px;
        --font-tag: 13px;
      }
      
      .screen-header {
        padding: 48px 40px 28px;
      }
    }
  </style>
</head>
<body>
  <section class="screen screen--5">
      <header class="screen-header">
        <div class="tag">
          <span class="tag-dot"></span>
          <span>SNS Templates</span>
        </div>
        <div class="headline-jp">ハッシュタグも<br>1タップで投稿</div>
        <div class="headline-en">One tap for hashtags & posts.</div>
        <p class="subcopy">
          「#今日の積み上げ」などの定番フォーマットをSNS別に管理。
        </p>
      </header>
    </section>
</body>
</html>
